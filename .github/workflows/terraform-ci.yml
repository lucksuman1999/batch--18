name: "Terraform CI & Security Scan (tfsec)"

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tfsec-security-scan:
    name: "🔒 Security Scan (tfsec)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tfsec Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .
          soft_fail: true

  terraform-preprod-validate:
    name: "🧪 PREPROD - Terraform Validate & Plan"
    runs-on: ubuntu-latest
    needs: tfsec-security-scan
    defaults:
      run:
        working-directory: PREPROD/azurerm_resource_group

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  terraform-prod-validate:
    name: "🧪 PROD - Terraform Validate & Plan"
    runs-on: ubuntu-latest
    needs: tfsec-security-scan
    defaults:
      run:
        working-directory: PROD/azurerm_virtual_network

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
